name: Deploy garden to GitHub Pages

# Builds the Astro site from the notes committed by `npm run deploy` and
# publishes it to GitHub Pages (christianp.space is set in the repo's Pages
# settings, so no CNAME file is needed).
#
# Rollback to Quartz: Actions -> "Deploy Quartz site to GitHub Pages" ->
# Run workflow on the v5 branch.

on:
  push:
    branches:
      - astro
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
